# ==============================================================================
# 生产环境 Docker Compose 编排文件 (main 分支正式发版环境)
# 硬性规范：生产环境严禁使用 latest 标签！必须通过 IMAGE_TAG 传入具体版本号 (如 v1.0.0)
# ==============================================================================

services:
  korean-master-prod:
    image: ${IMAGE_REPO:-ghcr.io/jingtianla/korean-master}:${IMAGE_TAG:?错误：生产环境必须指定具体的语义化版本号 IMAGE_TAG（例如 v1.0.0），严禁留空或使用 latest！}
    container_name: korean-master-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./data/korean-prod.db
    volumes:
      - ./data-prod:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
