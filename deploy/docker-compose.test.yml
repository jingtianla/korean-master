# ==============================================================================
# 测试环境 Docker Compose 编排文件 (develop 分支对应测试环境)
# 默认使用 test 标签或指定 develop-<短SHA> 标签，端口映射为 3001
# ==============================================================================

services:
  korean-master-test:
    image: ${IMAGE_REPO:-ghcr.io/jingtianla/korean-master}:${IMAGE_TAG:-test}
    container_name: korean-master-test
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=test
      - PORT=3000
      - DATABASE_URL=file:./data/korean-test.db
    volumes:
      - ./data-test:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
