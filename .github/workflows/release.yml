name: "Release & Deploy Prod - 发版构建与生产环境审批部署"

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    name: "1. 构建版本镜像并生成 GitHub Release Notes"
    runs-on: ubuntu-24.04
    outputs:
      version_tag: ${{ steps.tag.outputs.version_tag }}
    steps:
      - name: 检出完整代码与历史标签
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取语义化版本号 (vX.Y.Z)
        id: tag
        run: |
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "当前发布版本: ${VERSION_TAG}"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送固定版本镜像 (严禁使用 latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 推送镜像至 GHCR 并提取构建产物包供阿里云服务器极速同步
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version_tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
          CID=$(docker create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version_tag }})
          mkdir -p /tmp/dist-sync
          docker cp "${CID}:/app/.next" /tmp/dist-sync/.next
          docker rm "${CID}"
          tar -czf app-next.tar.gz -C /tmp/dist-sync .next

      - name: 上传生产构建产物 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-app-next
          path: app-next.tar.gz

      - name: 自动生成 Release Notes 并发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

  deploy-production:
    name: "2. 自动部署到阿里云生产环境 (:3000) 并执行健康检查"
    needs: build-and-release
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      - name: 下载生产构建产物 Artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-app-next

      - name: 检查是否配置远程生产服务器 SSH
        id: check_prod_ssh
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          if [ -z "${PROD_SSH_HOST}" ]; then
            echo "has_ssh=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 未配置远程 PROD_SSH_HOST，当前为【本机 Docker 生产演练模式】。"
          else
            echo "has_ssh=true" >> $GITHUB_OUTPUT
          fi

      - name: GitHub 云端直接推送并部署到阿里云 ECS 生产环境 (:3000)
        if: steps.check_prod_ssh.outputs.has_ssh == 'true'
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          VERSION_TAG: ${{ needs.build-and-release.outputs.version_tag }}
        run: |
          mkdir -p ~/.ssh
          echo "${PROD_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          scp ${SSH_OPTS} app-next.tar.gz "${PROD_SSH_USER}@${PROD_SSH_HOST}:/tmp/app-next.tar.gz"
          ssh ${SSH_OPTS} "${PROD_SSH_USER}@${PROD_SSH_HOST}" "
            set -e
            rm -rf /tmp/korean-stage/.next
            tar -xzf /tmp/app-next.tar.gz -C /tmp/korean-stage
            docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_TAG} -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test /tmp/korean-stage
            cd /opt/korean-master/deploy
            bash deploy.sh prod ${VERSION_TAG}
          "
