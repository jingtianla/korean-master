name: "CD Test - 构建镜像并部署测试环境 (develop)"

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-test:
    name: "1. 构建并推送测试镜像 (develop-<shortSHA> & test)"
    runs-on: ubuntu-24.04
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算短 SHA 与镜像标签
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=develop-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 推送镜像至 GHCR 并提取构建产物包供云服务器极速同步
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
          CID=$(docker create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test)
          mkdir -p /tmp/dist-sync
          docker cp "${CID}:/app/.next" /tmp/dist-sync/.next
          docker rm "${CID}"
          tar -czf app-next.tar.gz -C /tmp/dist-sync .next

      - name: 上传构建产物 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-app-next
          path: app-next.tar.gz

  deploy-test:
    name: "2. 自动部署到阿里云测试环境 (:3001) 并执行健康检查"
    needs: build-and-push-test
    runs-on: ubuntu-24.04
    environment:
      name: test
    steps:
      - name: 下载构建产物 Artifact
        uses: actions/download-artifact@v4
        with:
          name: test-app-next

      - name: 检查是否配置远程测试服务器 SSH
        id: check_ssh
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
        run: |
          if [ -z "${TEST_SSH_HOST}" ]; then
            echo "has_ssh=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 未配置远程 TEST_SSH_HOST，当前为【本机 Docker 测试模式】。"
          else
            echo "has_ssh=true" >> $GITHUB_OUTPUT
          fi

      - name: GitHub 云端直接推送并部署到阿里云 ECS 测试环境 (:3001)
        if: steps.check_ssh.outputs.has_ssh == 'true'
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
          TEST_SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
          IMAGE_TAG: ${{ needs.build-and-push-test.outputs.image_tag }}
        run: |
          mkdir -p ~/.ssh
          echo "${TEST_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          scp ${SSH_OPTS} app-next.tar.gz "${TEST_SSH_USER}@${TEST_SSH_HOST}:/tmp/app-next.tar.gz"
          ssh ${SSH_OPTS} "${TEST_SSH_USER}@${TEST_SSH_HOST}" "
            set -e
            rm -rf /tmp/korean-stage/.next
            tar -xzf /tmp/app-next.tar.gz -C /tmp/korean-stage
            docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test /tmp/korean-stage
            cd /opt/korean-master/deploy
            bash deploy.sh test ${IMAGE_TAG}
          "
