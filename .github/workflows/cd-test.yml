name: "CD Test - 构建镜像并部署测试环境 (develop)"

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-test:
    name: "1. 构建并推送测试镜像 (develop-<shortSHA> & test)"
    runs-on: ubuntu-24.04
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算短 SHA 与镜像标签
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=develop-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    name: "2. 部署到测试环境并执行健康检查"
    needs: build-and-push-test
    runs-on: ubuntu-24.04
    environment:
      name: test
    steps:
      - name: 检查是否配置远程测试服务器 SSH (兼容本机 Docker 模式)
        id: check_ssh
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
        run: |
          if [ -z "${TEST_SSH_HOST}" ]; then
            echo "has_ssh=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 未配置远程 TEST_SSH_HOST，当前为【本机 Docker 测试模式】。"
            echo "👉 请在自己电脑项目目录执行：docker compose -f deploy/docker-compose.test.yml pull && docker compose -f deploy/docker-compose.test.yml up -d"
          else
            echo "has_ssh=true" >> $GITHUB_OUTPUT
          fi

      - name: SSH 登录测试服务器部署并做健康检查
        if: steps.check_ssh.outputs.has_ssh == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          port: ${{ secrets.TEST_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/korean-master/test
            export IMAGE_REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            export IMAGE_TAG="${{ needs.build-and-push-test.outputs.image_tag }}"
            docker compose -f docker-compose.test.yml pull
            docker compose -f docker-compose.test.yml up -d
            echo "⏳ 等待服务启动并执行健康检查..."
            for i in {1..15}; do
              if curl -fsS http://localhost:3001/api/health > /dev/null; then
                echo "✅ 测试环境健康检查通过 (Version: ${IMAGE_TAG})！"
                exit 0
              fi
              sleep 2
            done
            echo "❌ 测试环境健康检查超时失败！"
            exit 1
